<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under a notch (the safe-area
         insets in nano.css keep content out of it); interactive-widget tells
         the browser to shrink the layout viewport for the on-screen keyboard
         rather than scrolling the composer out from under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#191a1b" />
    <title>nano</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Match predecessor: restore the theme synchronously before the module mounts,
         avoiding a dark flash when a light preference is saved. -->
    <script>
      (function () {
        var theme = 'dark'
        try { theme = localStorage.getItem('nano-theme') || 'dark' } catch (_) {}
        if (theme === 'light') {
          document.documentElement.classList.add('light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = '#f5f5f5'
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
